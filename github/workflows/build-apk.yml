name: Build Fai Fai Kitchen APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check permanent signing key secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)

      - name: Restore permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/fai-fai-kitchen-release.jks
          chmod 600 app/fai-fai-kitchen-release.jks

      - name: Set version
        run: |
          echo "APP_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=1.11.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build permanently signed release APK
        env:
          ANDROID_KEYSTORE_PATH: fai-fai-kitchen-release.jks
          ANDROID_KEYSTORE_PASSWORD: 3EtFFNb49AX2nJcS!T0FOXo0
          ANDROID_KEY_ALIAS: faifaikitchen
          ANDROID_KEY_PASSWORD: qs8%0nhdlogibreS#bz64Nm#
        run: gradle --no-daemon assembleRelease

      - name: Verify APK signature
        run: apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Name APK
        run: cp app/build/outputs/apk/release/app-release.apk Fai-Fai-Printer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fai-Fai-Kitchen-Signed-APK
          path: Fai-Fai-Printer.apk
          if-no-files-found: error
          retention-days: 30
