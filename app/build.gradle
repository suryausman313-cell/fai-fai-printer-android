plugins {
    id 'com.android.application'
}

android {
    namespace 'com.faifai.printer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.faifai.printer'
        minSdk 24
        targetSdk 35
        // GitHub Actions supplies a monotonically increasing version code.
        // Local fallback is intentionally above the currently installed v12.
        versionCode (System.getenv('APP_VERSION_CODE') ?: '1001').toInteger()
        versionName System.getenv('APP_VERSION_NAME') ?: '1.11.0'
    }

    signingConfigs {
        release {
            def ksPath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
