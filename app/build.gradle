plugins {
    id 'com.android.application'
}

android {
    namespace 'com.faifai.printer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.faifai.printer'
        minSdk 24
        targetSdk 35
        // Safely above the currently installed versionCode 12.
        versionCode 1001
        versionName '1.11.1'
    }

    signingConfigs {
        release {
            // The workflow restores this file before assembleRelease runs.
            storeFile file('fai-fai-kitchen-release.jks')
            storePassword '3EtFFNb49AX2nJcS!T0FOXo0'
            keyAlias 'faifaikitchen'
            keyPassword 'qs8%0nhdlogibreS#bz64Nm#'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
