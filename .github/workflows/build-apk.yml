name: Build Fai Fai Kitchen Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: Repository secret ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/fai-fai-kitchen-release.jks
          test -s app/fai-fai-kitchen-release.jks
          keytool -list \
            -keystore app/fai-fai-kitchen-release.jks \
            -storepass '3EtFFNb49AX2nJcS!T0FOXo0' \
            -alias faifaikitchen >/dev/null

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify signed APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$APK"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Name APK
        run: cp app/build/outputs/apk/release/app-release.apk Fai-Fai-Printer-v1023-SIGNED.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Fai-Fai-Kitchen-Signed-APK-v1023
          path: Fai-Fai-Printer-v1023-SIGNED.apk
          if-no-files-found: error
          retention-days: 30
