name: Build Fai Fai Kitchen Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check signing secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 repository secret is missing"
            exit 1
          fi

      - name: Restore permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/fai-fai-kitchen-release.jks
          test -s app/fai-fai-kitchen-release.jks

      - name: Build signed release APK
        run: gradle --no-daemon assembleRelease

      - name: Verify signed APK
        run: apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Name APK
        run: cp app/build/outputs/apk/release/app-release.apk Fai-Fai-Printer.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Fai-Fai-Kitchen-Signed-APK
          path: Fai-Fai-Printer.apk
          if-no-files-found: error
          retention-days: 30
